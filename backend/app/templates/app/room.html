<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room</title>
</head>
<body>
    <h1>Room Code: {{ room_code }}</h1>
    <script>
    const roomCode = "{{ room_code }}";
    const chatSocket = new WebSocket(

        + window.location.host + '/ws/chat/' + roomCode + '/'
    );
    </script>

</body>
